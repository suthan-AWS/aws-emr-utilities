AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Event-driven Spark event log aggregation for EMR Serverless. Copies only Spark
  event logs (under sparklogs/) into a single flat Spark History Server log directory.
  Supports two trigger modes: direct S3 Event Notification (greenfield) or EventBridge
  (pre-existing/shared source bucket). Includes SQS DLQ for failed invocations.

Parameters:
  SourceBucketName:
    Type: String
    Description: Name of the source bucket where EMR Serverless writes logs
  DestinationBucketName:
    Type: String
    Description: Name for the destination bucket (must be globally unique)
  LogPrefix:
    Type: String
    Default: logs/applications/
    Description: >
      Only objects under this prefix trigger the copy Lambda. Use
      'dataproc-emr-serverless/' for platform-managed EMR Serverless environments.
  DestinationPrefix:
    Type: String
    Default: logs/
    Description: >
      Spark History Server log directory in the destination bucket. Event logs land
      at <DestinationPrefix>eventlog_v2_<job-run-id>/... regardless of source app/job.
  TriggerMode:
    Type: String
    Default: S3Notification
    AllowedValues: [S3Notification, EventBridge]
    Description: >
      S3Notification: direct S3 event notification (requires ManageSourceBucket=true).
      EventBridge: S3 -> EventBridge -> Lambda (works with pre-existing buckets; requires
      EventBridge notifications enabled on the source bucket by the bucket owner).
  ManageSourceBucket:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Whether this stack creates and manages the source bucket. Set to 'false' when
      the source bucket is pre-existing and externally owned.
  SourceKmsKeyArn:
    Type: String
    Default: ''
    Description: >
      ARN of the KMS key used to encrypt objects in the source bucket. Leave empty
      if the source uses SSE-S3 (AES256) or is unencrypted.
  DestinationKmsKeyArn:
    Type: String
    Default: ''
    Description: >
      ARN of the KMS key to encrypt objects in the destination bucket. Leave empty
      to use SSE-S3 (AES256).

Conditions:
  UseS3Notification: !Equals [!Ref TriggerMode, S3Notification]
  UseEventBridge: !Equals [!Ref TriggerMode, EventBridge]
  CreateSourceBucket: !Equals [!Ref ManageSourceBucket, 'true']
  HasSourceKms: !Not [!Equals [!Ref SourceKmsKeyArn, '']]
  HasDestinationKms: !Not [!Equals [!Ref DestinationKmsKeyArn, '']]

Resources:

  # ---------- Destination bucket ----------
  DestinationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DestinationBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [HasDestinationKms, 'aws:kms', AES256]
              KMSMasterKeyID: !If [HasDestinationKms, !Ref DestinationKmsKeyArn, !Ref 'AWS::NoValue']

  # ---------- DLQ for failed invocations ----------
  CopyDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-copy-dlq'
      MessageRetentionPeriod: 1209600  # 14 days

  # ---------- Lambda execution role ----------
  CopyFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3CopyLeastPrivilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectTagging
                Resource: !Sub 'arn:aws:s3:::${SourceBucketName}/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectTagging
                  - s3:AbortMultipartUpload
                Resource: !Sub 'arn:aws:s3:::${DestinationBucketName}/*'
        - PolicyName: DlqSend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CopyDlq.Arn
        - !If
          - HasSourceKms
          - PolicyName: SourceKmsDecrypt
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref SourceKmsKeyArn
          - !Ref 'AWS::NoValue'
        - !If
          - HasDestinationKms
          - PolicyName: DestinationKmsEncrypt
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - kms:GenerateDataKey
                    - kms:Encrypt
                  Resource: !Ref DestinationKmsKeyArn
          - !Ref 'AWS::NoValue'

  # ---------- Lambda function ----------
  CopyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-s3-log-copy'
      Runtime: python3.12
      Handler: index.lambda_handler
      MemorySize: 128
      Timeout: 60
      Role: !GetAtt CopyFunctionRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt CopyDlq.Arn
      Environment:
        Variables:
          DESTINATION_BUCKET: !Ref DestinationBucketName
          DESTINATION_PREFIX: !Ref DestinationPrefix
      Code:
        ZipFile: |
          import json, logging, os, urllib.parse
          import boto3
          from botocore.config import Config

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          s3 = boto3.client("s3", config=Config(retries={"max_attempts": 3, "mode": "adaptive"}))
          DESTINATION_BUCKET = os.environ["DESTINATION_BUCKET"]
          DESTINATION_PREFIX = os.environ.get("DESTINATION_PREFIX", "logs/")
          SPARKLOGS_MARKER = "/sparklogs/"
          COPY_OBJECT_MAX_BYTES = 5 * 1024 * 1024 * 1024

          def _normalize_events(event):
              if "Records" in event:
                  for record in event["Records"]:
                      try:
                          bucket = record["s3"]["bucket"]["name"]
                          key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
                          size = record["s3"]["object"].get("size", 0)
                          yield bucket, key, size
                      except KeyError:
                          logger.error("Malformed S3 notification record: %s", json.dumps(record))
                          yield None, None, None
              elif "detail" in event:
                  detail = event["detail"]
                  try:
                      yield detail["bucket"]["name"], detail["object"]["key"], detail["object"].get("size", 0)
                  except KeyError:
                      logger.error("Malformed EventBridge detail: %s", json.dumps(event)[:500])
                      yield None, None, None
              else:
                  logger.error("Unrecognized event shape: %s", json.dumps(event)[:500])

          def destination_key_for(source_key):
              idx = source_key.find(SPARKLOGS_MARKER)
              if idx == -1:
                  return None
              return DESTINATION_PREFIX + source_key[idx + len(SPARKLOGS_MARKER):]

          def lambda_handler(event, context):
              copied, skipped, failed = 0, 0, 0
              for bucket, key, size in _normalize_events(event):
                  if bucket is None:
                      failed += 1
                      continue
                  destination_key = destination_key_for(key)
                  if destination_key is None:
                      skipped += 1
                      logger.info("Skipped (not a spark event log): s3://%s/%s", bucket, key)
                      continue
                  try:
                      if size > COPY_OBJECT_MAX_BYTES:
                          _multipart_copy(bucket, key, destination_key, size)
                      else:
                          s3.copy_object(
                              CopySource={"Bucket": bucket, "Key": key},
                              Bucket=DESTINATION_BUCKET, Key=destination_key)
                      copied += 1
                      logger.info("Copied s3://%s/%s -> s3://%s/%s (%d bytes)",
                                  bucket, key, DESTINATION_BUCKET, destination_key, size)
                  except Exception:
                      failed += 1
                      logger.exception("Failed to copy s3://%s/%s -> s3://%s/%s",
                                       bucket, key, DESTINATION_BUCKET, destination_key)
              total = copied + skipped + failed
              result = {"copied": copied, "skipped": skipped, "failed": failed, "total": total}
              logger.info("Batch complete: %s", json.dumps(result))
              return result

          def _multipart_copy(source_bucket, source_key, destination_key, size):
              part_size = 1 * 1024 * 1024 * 1024
              mpu = s3.create_multipart_upload(Bucket=DESTINATION_BUCKET, Key=destination_key)
              upload_id = mpu["UploadId"]
              try:
                  parts, part_number, offset = [], 1, 0
                  while offset < size:
                      last_byte = min(offset + part_size, size) - 1
                      resp = s3.upload_part_copy(
                          Bucket=DESTINATION_BUCKET, Key=destination_key,
                          UploadId=upload_id, PartNumber=part_number,
                          CopySource={"Bucket": source_bucket, "Key": source_key},
                          CopySourceRange=f"bytes={offset}-{last_byte}")
                      parts.append({"ETag": resp["CopyPartResult"]["ETag"], "PartNumber": part_number})
                      offset = last_byte + 1
                      part_number += 1
                  s3.complete_multipart_upload(
                      Bucket=DESTINATION_BUCKET, Key=destination_key,
                      UploadId=upload_id, MultipartUpload={"Parts": parts})
              except Exception:
                  s3.abort_multipart_upload(
                      Bucket=DESTINATION_BUCKET, Key=destination_key, UploadId=upload_id)
                  raise

  # ---------- S3 Notification mode resources (greenfield) ----------
  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseS3Notification
    Properties:
      FunctionName: !Ref CopyFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:s3:::${SourceBucketName}'

  SourceBucket:
    Type: AWS::S3::Bucket
    Condition: CreateSourceBucket
    DependsOn: S3InvokePermission
    Properties:
      BucketName: !Ref SourceBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: !Ref LogPrefix
            Function: !GetAtt CopyFunction.Arn

  # ---------- EventBridge mode resources (pre-existing bucket) ----------
  EventBridgeInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseEventBridge
    Properties:
      FunctionName: !Ref CopyFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventBridgeRule.Arn

  EventBridgeRule:
    Type: AWS::Events::Rule
    Condition: UseEventBridge
    Properties:
      Name: !Sub '${AWS::StackName}-s3-object-created'
      Description: !Sub 'Route S3 Object Created events from ${SourceBucketName} to log copy Lambda'
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref SourceBucketName
          object:
            key:
              - prefix: !Ref LogPrefix
      Targets:
        - Arn: !GetAtt CopyFunction.Arn
          Id: copy-fn
          DeadLetterConfig:
            Arn: !GetAtt CopyDlq.Arn

  # DLQ policy — allow EventBridge to send failed delivery to the DLQ
  EventBridgeDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: UseEventBridge
    Properties:
      Queues:
        - !Ref CopyDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt CopyDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt EventBridgeRule.Arn

Outputs:
  SourceBucket:
    Condition: CreateSourceBucket
    Value: !Ref SourceBucket
  DestinationBucket:
    Value: !Ref DestinationBucket
  CopyFunctionArn:
    Value: !GetAtt CopyFunction.Arn
  DlqUrl:
    Value: !Ref CopyDlq
  EventBridgeRuleArn:
    Condition: UseEventBridge
    Value: !GetAtt EventBridgeRule.Arn
